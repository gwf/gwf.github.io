<!DOCTYPE html><html><head>
<title>ca</title>
<style>
  * { margin: 0; padding: 0; }
  html, body, #viewport { width: 100%; height: 100%; }
  body { background: #000; overflow: hidden; }
</style>
<script type="text/javascript">
//////////////////////////////////////////////////////////////////////////////
//
//  ca - one-dimensional cellular automata, from "The Computational Beauty
//  of Nature" (src/ca.c), drawn as an endless waterfall: each new
//  generation is computed from the previous one and the picture scrolls
//  upward, newest row at the bottom.
//
//  Rule convention, exactly as in ca.c: a rule is a string of length
//  (states-1)*(2*radius+1)+1; the sum of the cell and its neighbors within
//  `radius` (a ring, wrap=1) indexes the string, and the character there is
//  the next state.  "sq" (strong quiescence) forces a uniform neighborhood
//  of state i to stay i.  dorules() is ported as-is: in query mode it
//  measures Langton's lambda of a rule string; in generation mode it draws
//  a random rule and hill-climbs its lambda toward the requested value.
//
//  Extension (not in ca.c, which is sum-indexed only): the famous binary
//  radius-1 rules 30, 90, 110, 184, 54 are not totalistic, so a second
//  update function indexes a full 8-entry table by (left, center, right)
//  in Wolfram's numbering.  Everything else uses ca.c's sum table.
//
//  Curated program.  The page opens on a Wolfram elementary rule, and
//  every ~15 s the rule changes.  Three switches out of four MUTATE the
//  running rule rather than drawing a fresh one: candidates are neighbors
//  of the current rule (same family, states and radius) with 1-3 table
//  entries changed -- bits of the (l,c,r) table for an elementary rule,
//  characters of the sum string for a totalistic one (strong-quiescence
//  entries are kept).  Each mutant is run through the interestingness
//  screen below and the first that passes is used; if none of 40 mutants
//  pass, a fresh random rule is drawn as before.  Every fourth switch is a
//  jump instead, alternating between an elementary showcase (so one switch
//  in eight) and a fresh random rule (which is what keeps 3-4 state rules
//  in the rotation, since a chain of mutations never changes the state
//  count).  The showcase rules:
//    - Wolfram elementary rules 30, 90, 110, 184, 54, 22, 150, 126, 60, 73,
//      105.  Single-seed starts for the rules whose triangles are the
//      point (30, 90, 110, 22, 150, 126, 60); a random row for the rest
//      (184 needs traffic, 54 from a seed is just a period-4 blinker).
//    - Three-state totalistic codes 777, 912, 1599, 1635 written in ca.c's
//      string convention.
//  The fresh-rule fallback draws random rules with 3-4 states, radius 1-2
//  and lambda drawn from 0.30-0.50, the edge-of-chaos band the book
//  discusses.  Headless screening showed 30-60% of such rules die or
//  become periodic within a few hundred generations, so every candidate
//  (mutant or fresh) is first run for 300 generations from the current row
//  (spread over frames, a few seconds before it is needed) and only rules
//  that stay alive, are not periodic (for mutants and fresh rules, not
//  periodic even up to a shift of 3 cells per period, which weeds out the
//  plain shifting rules like 34 or 170 that a bit flip often lands on),
//  change 5-45% of cells per generation and keep at least a quarter of the
//  cells quiescent are used.  ca.c's
//  hill-climb double-counts a change when it draws the same index twice,
//  so its reported lambda can drift from the rule's true value; the port
//  keeps that behavior but re-measures lambda in query mode and only
//  accepts fresh rules whose true lambda is 0.25-0.55 (mutants are judged
//  by the behavioral screen alone, since a one-entry change can move
//  lambda a lot without changing the look much).
//  The last row of the old rule seeds the new one (thinned to a few cells
//  for single-seed rules), and the palette crossfades over ~60 rows, so
//  the waterfall never cuts.
//
//  Palette: per state, luminance steps of one hue plus one accent for the
//  top state; a different hue for each rule.  Cells are ~3 px at 1080p,
//  at most 640 columns.  The scroll moves ~42 rows/s with sub-cell offsets.
//
//////////////////////////////////////////////////////////////////////////////

// ---- CA core: faithful port of ca.c ------------------------------------

function caRnd(n) { return (Math.random() * n) | 0; }   // random() % n

function dorules(states, radius, sq, lambda, rules) {
  var area = 2 * radius + 1;
  var len = (states - 1) * area + 1;
  var N = Math.pow(states, area);
  var i, j, k, sum;
  var table = [];
  for (i = 0; i < area; i++) { table.push([]); for (j = 0; j < len; j++) table[i].push(0); }
  for (i = 0; i < len; i++) table[0][i] = (i < states) ? 1 : 0;
  for (i = 1; i < area; i++)
    for (j = 0; j < len; j++) {
      sum = 0;
      for (k = 0; k < states; k++) if (j - k >= 0) sum += table[i - 1][j - k];
      table[i][j] = sum;
    }
  var vals = [];
  for (i = 0; i < len; i++) vals.push(table[area - 1][i] / N);

  if (rules) {
    var lam = 0;
    for (i = 0; i < len; i++) if (rules.charAt(i) !== '0') lam += vals[i];
    return { rules: rules, lambda: lam };
  }

  var bits = [];
  for (i = 0; i < len; i++) bits.push(caRnd(2));
  if (sq) { bits[0] = 0; for (i = 1; i < states; i++) bits[i * area] = 1; }
  var oldlambda = 0;
  for (i = 0; i < len; i++) oldlambda += vals[i] * bits[i];
  var noimprove = 0, a, b, aval, bval, newlambda;
  while (true) {
    while (true) { a = caRnd(len); if (sq && (a % area === 0)) continue; aval = caRnd(2); break; }
    while (true) { b = caRnd(len); if (sq && (b % area === 0)) continue; bval = caRnd(2); break; }
    newlambda = oldlambda + (aval - bits[a]) * vals[a] + (bval - bits[b]) * vals[b];
    if (Math.abs(newlambda - lambda) < Math.abs(oldlambda - lambda)) {
      oldlambda = newlambda; bits[a] = aval; bits[b] = bval; noimprove = 0;
    } else noimprove++;
    if (noimprove === 1000) break;
  }
  var out = [];
  for (i = 0; i < len; i++) out.push(bits[i] ? String.fromCharCode(caRnd(states - 1) + 49) : '0');
  if (sq) for (i = 1; i < states; i++) out[i * area] = String(i);
  return { rules: out.join(''), lambda: oldlambda };
}

// One generation with ca.c's sum-indexed rule table on a ring of `width`.
function caStepSum(src, dst, width, radius, tab) {
  var sum = 0, j;
  for (j = -radius; j <= radius; j++) sum += src[(j + width) % width];
  for (var x = 0; x < width; x++) {
    dst[x] = tab[sum];
    sum += src[(x + radius + 1) % width] - src[(x - radius + width) % width];
  }
}
// One generation with a full (l,c,r) table, Wolfram numbering.
function caStepWolfram(src, dst, width, tab) {
  var l = src[width - 1], c = src[0], r;
  for (var x = 0; x < width; x++) {
    r = src[x === width - 1 ? 0 : x + 1];
    dst[x] = tab[(l << 2) | (c << 1) | r];
    l = c; c = r;
  }
}
function wolframTable(n) { var t = new Uint8Array(8); for (var i = 0; i < 8; i++) t[i] = (n >> i) & 1; return t; }
function sumTable(rules) { var t = new Uint8Array(rules.length); for (var i = 0; i < rules.length; i++) t[i] = rules.charCodeAt(i) - 48; return t; }

// A rule object: {states, radius, step(src,dst)} -- both families.
function makeSumRule(rules, states, radius) {
  var tab = sumTable(rules);
  return { states: states, radius: radius, name: rules, rules: rules,
           step: function(src, dst, width) { caStepSum(src, dst, width, radius, tab); } };
}
function makeWolframRule(n) {
  var tab = wolframTable(n);
  return { states: 2, radius: 1, name: 'rule ' + n, n: n,
           step: function(src, dst, width) { caStepWolfram(src, dst, width, tab); } };
}

// A neighbor of `rule`: same family, states and radius, with 1-3 table
// entries changed.  Strong-quiescence entries of a sum rule stay put.
function mutateRule(rule) {
  var k = 1 + caRnd(3), i, j;
  if (rule.n !== undefined) {
    var n = rule.n;
    do { for (i = 0; i < k; i++) n ^= 1 << caRnd(8); } while (n === rule.n);
    return makeWolframRule(n);
  }
  var area = 2 * rule.radius + 1, t, out;
  do {
    t = rule.rules.split('');
    for (i = 0; i < k; i++) {
      do { j = caRnd(t.length); } while (j % area === 0);
      var v = (t[j].charCodeAt(0) - 48 + 1 + caRnd(rule.states - 1)) % rule.states;
      t[j] = String.fromCharCode(48 + v);
    }
    out = t.join('');
  } while (out === rule.rules);   // two changes to one entry can cancel
  return makeSumRule(out, rule.states, rule.radius);
}

// Run a rule from `seed` for `rows` generations and measure it.
function screenRule(rule, seed, width, rows) {
  var a = new Uint8Array(seed), b = new Uint8Array(width);
  var hist = [], chg = 0, nz = 0, dead = false, period = 0, shifted = 0, half = rows >> 1;
  for (var t = 0; t < rows; t++) {
    rule.step(a, b, width);
    var c = 0, n = 0;
    for (var x = 0; x < width; x++) { if (a[x] !== b[x]) c++; if (b[x]) n++; }
    var s = a; a = b; b = s;
    if (t >= half) { chg += c / width; nz += n / width; }
    if (n === 0) { dead = true; break; }
    if (t >= rows - 64) hist.push(String.fromCharCode.apply(null, a));
  }
  if (!dead) {
    // Exact periodicity, and periodicity up to a rotation of the ring by
    // -3..3 cells per period (a pattern that just slides sideways).
    var rot = [];
    for (var sft = -3; sft <= 3; sft++) {
      var rows2 = [];
      for (var h = 0; h < hist.length; h++) { var m = ((sft % width) + width) % width; rows2.push(hist[h].slice(m) + hist[h].slice(0, m)); }
      rot.push(rows2);
    }
    for (var p = 1; p <= 32 && !shifted; p++)
      for (var si = 0; si < rot.length; si++) {
        var ok = true, rr = rot[si];
        for (var q = 0; q + p < hist.length; q++) if (hist[q] !== rr[q + p]) { ok = false; break; }
        if (ok) { if (si === 3) period = p; shifted = p; break; }
      }
  }
  return { dead: dead, period: period, shifted: shifted, chg: chg / (rows - half), nz: nz / (rows - half) };
}

// ---- Presentation --------------------------------------------------------

window.onload = function() {

  var canvas = document.getElementById("viewport");
  var ctx = canvas.getContext("2d");
  var done = 0;

  var MAX_COLS = 640, MIN_CELL = 3, MAX_STATES = 4;
  var ROWS_PER_SEC = 42, RULE_TIME = 15000, PREP_AHEAD = 5000, XFADE_ROWS = 60;
  var SCREEN_ROWS = 300, MUTANTS = 40, JUMP_EVERY = 4;

  var ELEM = [
    { n: 30, seed: 'single' }, { n: 90, seed: 'single' }, { n: 110, seed: 'single' },
    { n: 184, seed: 'random', odds: 3 }, { n: 54, seed: 'random', odds: 2 },
    { n: 22, seed: 'single' }, { n: 150, seed: 'single' }, { n: 126, seed: 'single' },
    { n: 60, seed: 'single' }, { n: 73, seed: 'random', odds: 2 }, { n: 105, seed: 'random', odds: 2 }
  ];
  var NATIVE = [   // 3-state radius-1 totalistic codes in ca.c's sum-string convention
    "0121001", "0120201", "0202102", "0210202"
  ];
  // Hue palettes: [deep, pale, accent].
  var HUES = [
    [[14, 70, 88], [96, 160, 164], [220, 232, 226]],
    [[90, 48, 10], [172, 136, 84], [232, 222, 206]],
    [[55, 30, 105], [132, 112, 176], [222, 214, 232]],
    [[20, 55, 115], [108, 138, 184], [216, 224, 236]],
    [[15, 80, 60], [104, 160, 126], [214, 230, 220]],
    [[110, 30, 50], [172, 112, 126], [230, 216, 216]]
  ];

  var W = 0, H = 0, cols = 0, nrows = 0, cellW = 0, cellH = 0;
  var off, offctx, img, pix;
  var hist, rowLut, head = 0, rowAcc = 0;
  var rowA, rowB, prev2, prev3;
  var rule = null, nextRule = null, kind = 'mutate', elemOrder = [], hueIdx = 0;
  var lutCur, lutPrev, xfade = 1;
  var ruleT0 = 0, prepTries = 0, mutTries = 0, switches = 0, preparing = false;
  var staticRows = 0;

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function makeLut(states) {
    var h = HUES[hueIdx]; hueIdx = (hueIdx + 1) % HUES.length;
    var D = h[0], P = h[1], A = h[2];
    var L = new Float32Array(MAX_STATES * 3);
    L[0] = 5; L[1] = 5; L[2] = 10;
    for (var s = 1; s < states; s++) {
      var c;
      if (states === 2) c = P;
      else if (s === states - 1) c = A;
      else { var t = states === 3 ? 0.55 : (s - 1) / (states - 2); c = [D[0] + (P[0] - D[0]) * t, D[1] + (P[1] - D[1]) * t, D[2] + (P[2] - D[2]) * t]; }
      L[s * 3] = c[0]; L[s * 3 + 1] = c[1]; L[s * 3 + 2] = c[2];
    }
    return L;
  }

  // Seed for a candidate rule, derived from the newest row (continuity).
  function seedFrom(row, states, mode, odds) {
    var s = new Uint8Array(cols), n = 0, i;
    for (i = 0; i < cols; i++) { s[i] = Math.min(row[i], states - 1); if (s[i]) n++; }
    if (mode === 'single') {
      var keep = 1 + caRnd(3), kept = 0;
      var idx = []; for (i = 0; i < cols; i++) if (s[i]) idx.push(i);
      shuffle(idx);
      var out = new Uint8Array(cols);
      for (i = 0; i < idx.length && kept < keep; i++) { out[idx[i]] = s[idx[i]]; kept++; }
      if (!kept) out[cols >> 1] = 1;
      return out;
    }
    if (n < cols * 0.03) {
      var o = odds || 3;
      for (i = 0; i < cols; i++) if (caRnd(o) === 0) s[i] = caRnd(states - 1) + 1;   // ca.c "-N" init
    }
    return s;
  }

  function nextElem() {
    if (!elemOrder.length) elemOrder = shuffle(ELEM.map(function(_, i) { return i; }));
    return ELEM[elemOrder.shift()];
  }

  // Try one candidate for the upcoming rule; returns true when settled.
  // kind 'elem': a showcase rule.  kind 'mutate': neighbors of the running
  // rule first (up to MUTANTS of them), then the fresh random-rule path.
  function tryCandidate() {
    var cand, seedMode, odds, accept, tries;
    if (kind === 'elem') {
      tries = ++prepTries;
      if (Math.random() < 0.25) { cand = makeSumRule(NATIVE[caRnd(NATIVE.length)], 3, 1); seedMode = 'random'; odds = 2; }
      else { var e = nextElem(); cand = makeWolframRule(e.n); seedMode = e.seed; odds = e.odds; }
    } else if (kind === 'mutate' && mutTries < MUTANTS) {
      tries = ++mutTries;
      cand = mutateRule(rule); seedMode = 'random'; odds = 2;
    } else {
      tries = ++prepTries;
      var states = 3 + caRnd(2), radius = 1 + caRnd(2);
      var lam = 0.30 + Math.random() * 0.20;
      var r = dorules(states, radius, 1, lam, null);
      // ca.c tracks lambda with a small bug (a double-counted change when it
      // draws the same index twice), so re-measure the real value in query
      // mode and insist it lies in the intended band.
      var real = dorules(states, radius, 1, 0, r.rules).lambda;
      if (real < 0.25 || real > 0.55) return false;
      cand = makeSumRule(r.rules, states, radius); seedMode = 'random'; odds = 2;
    }
    var seed = seedFrom(hist.subarray(head * cols, head * cols + cols), cand.states, seedMode, odds);
    var st = screenRule(cand, seed, cols, SCREEN_ROWS);
    if (kind === 'elem') accept = !st.dead && !st.period;
    else accept = !st.dead && !st.shifted && st.nz > 0.03 && st.nz < 0.75 &&
                  st.chg >= 0.05 && st.chg <= (tries > 20 ? 0.6 : 0.45);
    if (prepTries > 40) { cand = makeWolframRule(Math.random() < 0.5 ? 30 : 110); seedMode = 'single'; accept = true; }
    if (!accept) return false;
    nextRule = cand; nextRule.seedMode = seedMode; nextRule.odds = odds;
    return true;
  }

  function switchRule(now) {
    var r = nextRule || makeWolframRule(110);
    nextRule = null;
    var seed = seedFrom(hist.subarray(head * cols, head * cols + cols), r.states, r.seedMode || 'single', r.odds);
    rowA.set(seed);
    rule = r;
    lutPrev = lutCur; lutCur = makeLut(r.states); xfade = 0;
    switches++;
    if (switches % JUMP_EVERY !== JUMP_EVERY - 1) kind = 'mutate';
    else kind = ((switches / JUMP_EVERY) | 0) % 2 === 0 ? 'elem' : 'lambda';
    ruleT0 = now; preparing = false; prepTries = 0; mutTries = 0; staticRows = 0;
  }

  function pushRow(row) {
    head = (head + 1) % nrows;
    hist.set(row, head * cols);
    var L = rowLut.subarray(head * MAX_STATES * 3, (head + 1) * MAX_STATES * 3);
    if (xfade < 1) {
      xfade = Math.min(1, xfade + 1 / XFADE_ROWS);
      var u = xfade * xfade * (3 - 2 * xfade);
      for (var i = 0; i < MAX_STATES * 3; i++) L[i] = lutPrev[i] + (lutCur[i] - lutPrev[i]) * u;
    } else L.set(lutCur);
  }

  // Generate the next row.  Rows that repeat with period 1, 2 or 3 (or die)
  // count as static; enough of them in a row hurries the next rule in.
  function generate() {
    rule.step(rowA, rowB, cols);
    var s1 = true, s2 = true, s3 = true, nz = 0;
    for (var x = 0; x < cols; x++) {
      var v = rowB[x];
      if (rowA[x] !== v) s1 = false;
      if (prev2[x] !== v) s2 = false;
      if (prev3[x] !== v) s3 = false;
      if (v) nz++;
    }
    prev3.set(prev2); prev2.set(rowA);
    var t = rowA; rowA = rowB; rowB = t;
    pushRow(rowA);
    if (s1 || s2 || s3 || nz === 0) staticRows++; else staticRows = 0;
  }

  function init() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    if (W === 0 || H === 0) { canvas.width = 0; canvas.height = 0; return; }
    canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
    var cell = Math.max(MIN_CELL, W / MAX_COLS);
    var ncols = Math.max(32, Math.floor(W / cell));
    cellW = canvas.width / ncols; cellH = cellW;
    var rowsNeeded = Math.ceil(canvas.height / cellH) + 2;
    if (!off) { off = document.createElement("canvas"); offctx = off.getContext("2d"); }
    if (ncols !== cols || rowsNeeded !== nrows || !rule) {
      cols = ncols; nrows = rowsNeeded;
      off.width = cols; off.height = nrows;
      img = offctx.createImageData(cols, nrows);
      pix = img.data;
      for (var i = 3; i < pix.length; i += 4) pix[i] = 255;
      hist = new Uint8Array(nrows * cols);
      rowLut = new Float32Array(nrows * MAX_STATES * 3);
      rowA = new Uint8Array(cols); rowB = new Uint8Array(cols);
      prev2 = new Uint8Array(cols); prev3 = new Uint8Array(cols);
      head = 0; rowAcc = 0;
      var first = nextElem();
      rule = makeWolframRule(first.n);
      lutCur = makeLut(2); lutPrev = lutCur; xfade = 1;
      for (var r = 0; r < nrows; r++) rowLut.set(lutCur, r * MAX_STATES * 3);
      rowA.set(seedFrom(new Uint8Array(cols), 2, first.seed, first.odds));
      hist.set(rowA, 0);
      kind = 'mutate'; switches = 0; ruleT0 = performance.now(); preparing = false; prepTries = 0; mutTries = 0; nextRule = null;
    }
  }

  function render(frac) {
    // Rebuild the image: row 0 of the picture is the oldest row in the ring.
    var oldest = (head + 1) % nrows;
    for (var r = 0; r < nrows; r++) {
      var ri = (oldest + r) % nrows, base = ri * cols, lb = ri * MAX_STATES * 3;
      var p = r * cols * 4;
      for (var x = 0; x < cols; x++, p += 4) {
        var q = lb + hist[base + x] * 3;
        pix[p] = rowLut[q]; pix[p + 1] = rowLut[q + 1]; pix[p + 2] = rowLut[q + 2];
      }
    }
    offctx.putImageData(img, 0, 0);
    ctx.fillStyle = "#050509";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.imageSmoothingEnabled = false;
    // The newest row emerges from the bottom edge as frac goes 0 -> 1.
    var bottom = canvas.height + (1 - frac) * cellH;
    ctx.drawImage(off, 0, 0, cols, nrows, 0, bottom - nrows * cellH, cols * cellW, nrows * cellH);
  }

  var lastT = 0;
  function loop(now) {
    window.requestAnimationFrame(loop);
    if (done) { ruleT0 += now - lastT; lastT = now; return; }
    var dt = Math.min(100, now - lastT); lastT = now;
    if (canvas.width === 0 || canvas.clientWidth !== W || canvas.clientHeight !== H) { init(); return; }

    var el = now - ruleT0;
    if (staticRows > 24 && el < RULE_TIME - PREP_AHEAD) ruleT0 = now - (RULE_TIME - PREP_AHEAD);  // dead/static: hurry the switch
    if (el >= RULE_TIME - PREP_AHEAD && !nextRule) {
      preparing = true;
      for (var k = 0; k < 2 && !nextRule; k++) tryCandidate();
    }
    if (el >= RULE_TIME && nextRule) switchRule(now);

    rowAcc += dt * ROWS_PER_SEC / 1000;
    var n = Math.min(4, rowAcc | 0);
    for (var i = 0; i < n; i++) generate();
    rowAcc -= n;
    render(rowAcc);
  }

  window.onclick = function() { done = !done; };
  var rt;
  window.onresize = function() { clearTimeout(rt); rt = setTimeout(init, 150); };
  init();
  lastT = performance.now();
  window.requestAnimationFrame(loop);
};
//////////////////////////////////////////////////////////////////////////////
</script></head>
<body><canvas id="viewport"></canvas></body></html>
