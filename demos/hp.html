<!DOCTYPE html><html><head>
<title>hp</title>
<style>
  * { margin: 0; padding: 0; }
  html, body, #viewport { width: 100%; height: 100%; }
  body { background: #000; overflow: hidden; }
</style>
<script type="text/javascript">
//////////////////////////////////////////////////////////////////////////////
//
//  hp - the hodgepodge machine, from "The Computational Beauty of Nature"
//  (src/hp.c).  A cellular model of the Belousov-Zhabotinsky reaction that
//  self-organizes into rotating spiral waves.
//
//  Each cell is in one of `states` states: 0 is healthy, states-1 is ill,
//  everything between is infected.  With Ninf / Nill the infected / ill
//  neighbors and S the sum of the neighborhood including the cell itself:
//     healthy  -> floor(Ninf / k1) + floor(Nill / k2)
//     infected -> floor(S / (Ninf + 1)) + g
//     ill      -> 0
//  clamped to states-1.  update_cell() is ported exactly, including the
//  fact that hp.c's `floor` is an (int) cast, S/(Ninf+1) is integer
//  division, and k1, k2, g are doubles.  Toroidal wrap, synchronous update.
//
//  Curated presets (states = 100 throughout).  hp.c's defaults are
//  k1=2 k2=3 g=34 with the 8-cell neighborhood; the header notes that a
//  4-cell neighborhood (with k1, k2 halved) gives more spirals.  All of the
//  presets below were chosen by running the machine headlessly on a
//  320x200 torus for 12,000 steps from random initial states (and
//  re-checked at 640x400, where all four spiral by ~300-600 steps) and keeping
//  only parameter sets that (a) never died to all-healthy or froze,
//  (b) kept ~95-99% of cells changing every step with a steady mean state
//  (no whole-field flashing), and (c) had low spatial roughness, i.e. smooth
//  wave fronts rather than fine-grained turbulence; contact sheets of the
//  resulting fields were then inspected for spirals.
//     k1=3   k2=3  g=28  8-nbr  rounded spirals; after minutes one giant core
//     k1=3   k2=3  g=18  8-nbr  dense rounded spirals
//     k1=2   k2=3  g=34  8-nbr  hp.c defaults: square-ish spirals
//     k1=3   k2=3  g=22  8-nbr  tight spirals, many cores
//  (verified on a headless contact sheet at 600-8000 steps).
//
//  Timeline: each preset holds ~45 s, then the next is brought in.  Within
//  the 8-neighbor family, g is ramped linearly over 8 s (g is a double in
//  hp.c, so the ramp is a legitimate parameter path and the spirals morph
//  continuously).  Switching neighborhood size is done as a single
//  instantaneous parameter change on the live grid, because intermediate
//  parameter values between the two families are dead (verified: 30/30
//  instant switches survived headlessly; every ramp across families died).
//  A watchdog re-seeds a random patch if the field ever goes quiet.
//
//  Modernization: the state is rendered through a deep-indigo -> cyan ->
//  white gradient with a little temporal smoothing and bilinear upscaling
//  of an offscreen image of at most 640x400 cells (cells ~3 px at 1080p),
//  so it reads as liquid rather than pixels and the curls of the spirals
//  are resolved.  The simulation runs at a fixed 16 steps per second
//  (2-3 ms per step at full size, typed arrays, no per-step allocation).
//  A fresh field is pre-rolled 240 steps over the first second or so
//  (4 extra steps per frame, behind a fade from black) so the page opens
//  on forming spirals rather than on random noise.
//
//////////////////////////////////////////////////////////////////////////////

// ---- Simulation core: faithful port of hp.c update_cell -----------------

function Hodgepodge(W, H, states) {
  this.W = W; this.H = H; this.states = states;
  this.a = new Int32Array(W * H);
  this.b = new Int32Array(W * H);
  this.changed = 1;
  for (var i = 0; i < W * H; i++) this.a[i] = (Math.random() * (states - 1)) | 0;  // random_range(0, states-1)
}

// One synchronous step with parameters k1, k2, g (doubles) and diag (0/1).
// Returns the fraction of cells whose state changed.
Hodgepodge.prototype.step = function(k1, k2, g, diag) {
  var W = this.W, H = this.H, states = this.states, ill = states - 1;
  var old = this.a, nw = this.b, changed = 0;
  var gi = g;   // g is a double in hp.c; the result is truncated on assignment to int
  for (var y = 0; y < H; y++) {
    var ym = (y === 0 ? H - 1 : y - 1) * W, yp = (y === H - 1 ? 0 : y + 1) * W, y0 = y * W;
    for (var x = 0; x < W; x++) {
      var xm = x === 0 ? W - 1 : x - 1, xp = x === W - 1 ? 0 : x + 1;
      var self = old[y0 + x];
      var sum = self, numinf = 0, numill = 0, v;
      v = old[ym + x]; sum += v; if (v === ill) numill++; else if (v > 0) numinf++;
      v = old[yp + x]; sum += v; if (v === ill) numill++; else if (v > 0) numinf++;
      v = old[y0 + xm]; sum += v; if (v === ill) numill++; else if (v > 0) numinf++;
      v = old[y0 + xp]; sum += v; if (v === ill) numill++; else if (v > 0) numinf++;
      if (diag) {
        v = old[ym + xm]; sum += v; if (v === ill) numill++; else if (v > 0) numinf++;
        v = old[ym + xp]; sum += v; if (v === ill) numill++; else if (v > 0) numinf++;
        v = old[yp + xm]; sum += v; if (v === ill) numill++; else if (v > 0) numinf++;
        v = old[yp + xp]; sum += v; if (v === ill) numill++; else if (v > 0) numinf++;
      }
      var n;
      if (self === 0) n = ((numinf / k1) | 0) + ((numill / k2) | 0);          // floor(numinf/k1)+floor(numill/k2)
      else if (self < ill) n = (((sum / (numinf + 1)) | 0) + gi) | 0;         // floor(sum/(numinf+1)) + g
      else n = 0;
      if (n > ill) n = ill;
      nw[y0 + x] = n;
      if (n !== self) changed++;
    }
  }
  this.a = nw; this.b = old;
  this.changed = changed / (W * H);
  return this.changed;
};

// Watchdog helper: drop a square of random states into the field.
Hodgepodge.prototype.sprinkle = function(size) {
  var W = this.W, H = this.H, a = this.a;
  var x0 = (Math.random() * (W - size)) | 0, y0 = (Math.random() * (H - size)) | 0;
  for (var y = y0; y < y0 + size; y++)
    for (var x = x0; x < x0 + size; x++)
      a[y * W + x] = (Math.random() * (this.states - 1)) | 0;
};

// ---- Presentation --------------------------------------------------------

window.onload = function() {

  var canvas = document.getElementById("viewport");
  var ctx = canvas.getContext("2d");
  var done = 0;

  var STATES = 100;
  var PRESETS = [
    { k1: 3, k2: 3, g: 28, diag: 1 },   // rounded spirals, one giant core after minutes
    { k1: 3, k2: 3, g: 18, diag: 1 },   // dense rounded spirals
    { k1: 2, k2: 3, g: 34, diag: 1 },   // hp.c defaults: square-ish spirals
    { k1: 3, k2: 3, g: 22, diag: 1 }    // tight spirals, many cores
  ];
  // Reviewer's note: the 4-neighbor preset (k1=1,k2=3,g=20) was dropped after a
  // headless contact-sheet check showed it as hatched turbulence, not spirals;
  // the hp.c defaults and (3,3,28) were verified to spiral within ~600 steps.
  var ORDER = [0, 1, 2, 3];
  var HOLD = 45000, RAMP = 8000;
  var STEP_HZ = 16, MAX_COLS = 640, MAX_ROWS = 400, MIN_CELL = 3;
  var WARMUP = 240, WARM_PER_FRAME = 4;   // pre-roll steps for a fresh field

  var W = 0, H = 0, cols = 0, rows = 0;
  var off, offctx, img, pix, disp;
  var sim = null;
  var pi = Math.floor(Math.random() * ORDER.length);   // index into ORDER
  var cur = {}, from, to, phase = 0, t0 = 0, acc = 0;
  var quiet = 0, checkSteps = 0, warm = 0;

  // Palette: deep indigo (healthy) -> cyan (infected) -> white (ill).
  var LUT = new Uint8ClampedArray(256 * 3);
  (function() {
    var A = [8, 6, 36], B = [10, 150, 205], C = [245, 252, 255];
    for (var i = 0; i < 256; i++) {
      var u = i / 255, r, g, b;
      if (u < 0.55) { var t = Math.pow(u / 0.55, 1.35); r = A[0] + (B[0] - A[0]) * t; g = A[1] + (B[1] - A[1]) * t; b = A[2] + (B[2] - A[2]) * t; }
      else { var s = Math.pow((u - 0.55) / 0.45, 0.9); r = B[0] + (C[0] - B[0]) * s; g = B[1] + (C[1] - B[1]) * s; b = B[2] + (C[2] - B[2]) * s; }
      LUT[i * 3] = r; LUT[i * 3 + 1] = g; LUT[i * 3 + 2] = b;
    }
  })();

  function setParams(p) { cur.k1 = p.k1; cur.k2 = p.k2; cur.g = p.g; cur.diag = p.diag; }

  function init() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    if (W === 0 || H === 0) { canvas.width = 0; canvas.height = 0; return; }
    canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
    var cell = Math.max(MIN_CELL, W / MAX_COLS, H / MAX_ROWS);
    var ncols = Math.max(16, Math.round(W / cell));
    var nrows = Math.max(16, Math.round(H / cell));
    if (!off) { off = document.createElement("canvas"); offctx = off.getContext("2d"); }
    if (ncols !== cols || nrows !== rows || !sim) {
      cols = ncols; rows = nrows;
      off.width = cols; off.height = rows;
      img = offctx.createImageData(cols, rows);
      pix = img.data;
      for (var i = 3; i < pix.length; i += 4) pix[i] = 255;
      sim = new Hodgepodge(cols, rows, STATES);
      disp = new Float32Array(cols * rows);
      from = PRESETS[ORDER[pi]];
      setParams(from);
      phase = 0; t0 = performance.now(); acc = 0; warm = 0;
    }
  }

  function advance(now) {
    var el = now - t0;
    if (phase === 0 && el > HOLD) {
      to = PRESETS[ORDER[(pi + 1) % ORDER.length]];
      if (to.diag === from.diag) { phase = 1; t0 = now; }
      else { pi = (pi + 1) % ORDER.length; from = to; setParams(from); t0 = now; }
    } else if (phase === 1) {
      var u = Math.min(1, el / RAMP);
      u = u * u * (3 - 2 * u);
      cur.k1 = from.k1 + (to.k1 - from.k1) * u;
      cur.k2 = from.k2 + (to.k2 - from.k2) * u;
      cur.g = from.g + (to.g - from.g) * u;
      if (u >= 1) { pi = (pi + 1) % ORDER.length; from = to; setParams(from); phase = 0; t0 = now; }
    }
  }

  function simulate(steps) {
    for (var s = 0; s < steps; s++) {
      var c = sim.step(cur.k1, cur.k2, cur.g, cur.diag);
      if (++checkSteps >= 24) {
        checkSteps = 0;
        if (c < 0.02) { if (++quiet >= 3) { sim.sprinkle(Math.min(48, cols >> 2, rows >> 2)); quiet = 0; } }
        else quiet = 0;
      }
    }
  }

  function render() {
    var a = sim.a, n = cols * rows, k = 255 / (STATES - 1);
    for (var i = 0, p = 0; i < n; i++, p += 4) {
      var v = a[i], d = disp[i];
      if (v < d - 40) d = v;                 // ill -> healthy reset: snap
      else d += (v - d) * 0.5;
      disp[i] = d;
      var q = ((d * k) | 0) * 3;
      pix[p] = LUT[q]; pix[p + 1] = LUT[q + 1]; pix[p + 2] = LUT[q + 2];
    }
    offctx.putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(off, 0, 0, cols, rows, 0, 0, canvas.width, canvas.height);
    if (warm < WARMUP) {
      ctx.fillStyle = "rgba(0,0,0," + (1 - warm / WARMUP).toFixed(3) + ")";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
  }

  var lastT = 0;
  function loop(now) {
    window.requestAnimationFrame(loop);
    if (done) { t0 += now - lastT; lastT = now; return; }
    var dt = Math.min(100, now - lastT); lastT = now;
    if (canvas.width === 0 || canvas.clientWidth !== W || canvas.clientHeight !== H) { init(); return; }
    if (warm < WARMUP) { simulate(WARM_PER_FRAME); warm += WARM_PER_FRAME; t0 = now; }
    advance(now);
    acc += dt * STEP_HZ / 1000;
    var steps = Math.min(3, acc | 0);
    acc -= steps;
    if (steps > 0) simulate(steps);
    render();
  }

  window.onclick = function() { done = !done; };
  var rt;
  window.onresize = function() { clearTimeout(rt); rt = setTimeout(init, 150); };
  init();
  lastT = performance.now();
  window.requestAnimationFrame(loop);
};
//////////////////////////////////////////////////////////////////////////////
</script></head>
<body><canvas id="viewport"></canvas></body></html>
