<!DOCTYPE html><html><head>
<title>CBofN demos</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; color: #999; font: 14px/1.4 -apple-system, Helvetica, Arial, sans-serif; padding: 28px; }
  h1 { color: #ddd; font-weight: 300; font-size: 20px; margin-bottom: 6px; }
  p { max-width: 70em; margin-bottom: 20px; }
  a { color: #8ab4f8; text-decoration: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .tile { display: block; background: #000; border: 1px solid #222; border-radius: 4px; overflow: hidden; color: #aaa; }
  .tile:hover { border-color: #666; }
  .tile img { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #000; }
  .tile div { padding: 8px 10px; }
  .tile b { color: #eee; font-weight: 500; }
  .tile small { display: block; color: #777; }
</style></head>
<body>
<h1>The Computational Beauty of Nature &mdash; live demos</h1>
<p>Single-page, zero-dependency canvas/WebGL versions of the book's example programs
(<a href="https://github.com/gwf/CBofN">gwf/CBofN</a>). Each one runs full screen with no
controls; click anywhere to pause. <a href="random.html">random.html</a> loads one at random,
like a home page should.</p>
<div class="grid" id="grid"></div>
<script>
var DEMOS = [
  ["life",     "Game of Life",              "rain instead of restart, newborn cells glow"],
  ["life-classic", "Game of Life, classic", "the previous flake.org page"],
  ["ifs",      "Iterated Function Systems", "chaos game, morphing between the book's affine fractals"],
  ["lsys",     "L-systems",                 "weed, Koch, Penrose, Sierpinski, dragon, Hilbert, growing"],
  ["mandel",   "Mandelbrot set",            "WebGL zoom into curated coordinates"],
  ["julia",    "Julia sets",                "WebGL, c wandering the cardioid boundary"],
  ["bifur1d",  "Bifurcation diagram",       "logistic map, zooming into the cascade"],
  ["lorenz",   "Strange attractors",        "Lorenz, Rossler, predator-prey, Mackey-Glass particle clouds"],
  ["henwarp",  "Henon stretch and fold",    "a square warped onto the attractor, one iteration at a time"],
  ["ca",       "1-D cellular automata",     "waterfall of rules at the edge of chaos"],
  ["hp",       "Hodgepodge machine",        "Belousov-Zhabotinsky spirals"],
  ["vants",    "Virtual ants",              "generalized Langton ants"],
  ["termites", "Termites",                  "wood-chip piles without a leader"],
  ["boids",    "Boids",                     "the four rules, shifting between regimes"],
  ["diffuse",  "Diffusion-limited aggregation", "coral growth"],
  ["gsw",      "Grass, sheep, wolves",      "three-species ecosystem waves"],
  ["sipd",     "Spatial Prisoner's Dilemma","strategies competing on a lattice"],
  ["hopfield", "Associative memory",        "Hebbian network recalling patterns from noise"],
  ["mlp",      "Multilayer perceptron",     "backprop chasing a moving decision boundary"]
];
var g = document.getElementById("grid");
DEMOS.forEach(function(d) {
  var a = document.createElement("a");
  a.className = "tile"; a.href = d[0] + ".html";
  a.innerHTML = '<img src="thumbs/' + d[0] + '.png" alt="" onerror="this.style.visibility=\'hidden\'">' +
    '<div><b>' + d[1] + '</b><small>' + d[2] + '</small></div>';
  g.appendChild(a);
});
</script>
</body></html>
