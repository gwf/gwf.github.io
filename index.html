<!DOCTYPE html><html><head>
<meta charset="utf-8">
<title>flake.org</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Gary William Flake. Live programs from The Computational Beauty of Nature.">
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
<script type="text/javascript">
//////////////////////////////////////////////////////////////////////////////
//
//  flake.org - each visit shows one program from "The Computational Beauty
//  of Nature" full screen, chosen at random.  No UI; click to pause.
//
//  - #name in the URL pins a demo (flake.org/#lorenz).
//  - The last few demos shown in this browser are remembered so a return
//    visit gets something different.
//  - The WebGL demos are skipped if the browser has no WebGL.
//  - gallery.html lists everything.
//
//////////////////////////////////////////////////////////////////////////////
window.onload = function() {
  var DEMOS = [
    "life", "ifs", "lsys", "mandel", "julia", "bifur1d", "lorenz", "henwarp",
    "ca", "hp", "vants", "termites", "boids", "diffuse", "gsw", "sipd",
    "hopfield", "mlp"
  ];
  var WEBGL = { mandel: 1, julia: 1 };
  var pick = decodeURIComponent(location.hash.slice(1));
  if (DEMOS.indexOf(pick) < 0) {
    var pool = DEMOS.slice(), recent = [];
    try { recent = JSON.parse(localStorage.getItem("flake.recent") || "[]"); } catch (e) {}
    var gl = 0;
    try { var c = document.createElement("canvas"); gl = !!(c.getContext("webgl") || c.getContext("experimental-webgl")); } catch (e) {}
    pool = pool.filter(function(d) { return (gl || !WEBGL[d]) && recent.indexOf(d) < 0; });
    if (!pool.length) pool = DEMOS.slice();
    pick = pool[Math.floor(Math.random() * pool.length)];
    recent.push(pick); while (recent.length > 6) recent.shift();
    try { localStorage.setItem("flake.recent", JSON.stringify(recent)); } catch (e) {}
  }
  var f = document.createElement("iframe");
  f.src = pick + ".html";
  f.setAttribute("allow", "fullscreen");
  document.body.appendChild(f);
  window.onhashchange = function() { location.reload(); };
};
</script></head>
<body></body></html>
